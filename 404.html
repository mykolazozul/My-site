<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lost in the fog — 404 | Mykola Zozul</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('lang');
        if (q === 'uk' || q === 'en') localStorage.setItem('mz-lang', q);
        var l = localStorage.getItem('mz-lang') || ((navigator.languages || [navigator.language]).some(function (x) { return /^uk/i.test(x); }) ? 'uk' : 'en');
        if (l === 'uk') { var h = document.documentElement; h.lang = 'uk'; h.classList.add('i18n-pending'); setTimeout(function () { h.classList.remove('i18n-pending'); }, 1500); }
        if (sessionStorage.getItem('mz-lang-anim') !== null) { var r = document.documentElement; r.classList.add('lang-in'); r.setAttribute('data-lang-to', l === 'uk' ? 'Українська' : 'English'); setTimeout(function () { r.classList.remove('lang-in', 'lang-in-go'); }, 2500); }
      } catch (e) {}
    })();
  </script>
  <style>
    .nf { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; overflow: hidden; text-align: center; padding: 120px var(--gutter) 60px; }
    .nf__slit { position: absolute; left: 50%; top: 0; bottom: 0; width: clamp(40px, 6vw, 90px); transform: translateX(-50%);
      background: linear-gradient(to bottom, #2a2a2a, #9a9a98 40%, #efeeea 66%, #6c6c6a 72%, #0b0b0b); opacity: .9; }
    .nf__slit::after { content: ""; position: absolute; left: 50%; bottom: 9%; width: 6px; height: 18px; margin-left: -3px; background: #050505; border-radius: 3px 3px 1px 1px; }
    .nf__num { position: relative; font: 800 clamp(140px, 34vw, 520px)/.8 var(--display); font-stretch: 62%; color: transparent; -webkit-text-stroke: 1px rgba(239,238,234,.5); mix-blend-mode: difference; }
    .nf__body { position: relative; margin-top: 28px; }
    .nf__body h1 { font: 500 clamp(16px, 2vw, 26px)/1 var(--sans); }
    .nf__body p { margin: 18px auto 32px; color: var(--mute); max-width: 380px; }
    .nf__top { position: absolute; left: 0; right: 0; top: 24px; }
    .nf__top .wrap { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="nf">
    <div class="nf__top"><div class="wrap">
      <a class="logo" href="/"><span class="logo__mark"><span>MZ</span></span><span class="logo__text">Mykola Zozul<span>Design &amp; Operations</span></span></a>
      <span class="nf__right"><span class="mono mute">Error 404</span><button class="lang" type="button" data-lang-switch aria-label="Switch language"><span data-l="en">EN</span><span data-l="uk">UA</span></button></span>
    </div></div>
    <div class="nf__slit" aria-hidden="true"></div>
    <div>
      <p class="nf__num" aria-hidden="true">404</p>
      <div class="nf__body">
        <h1 class="spaced">Lost in the fog.</h1>
        <p>This page doesn’t exist — but the way back is right here.</p>
        <a class="btn btn--solid" href="/">Back to the portfolio <svg class="arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
      </div>
    </div>
  </main>
  <script type="module" src="/assets/js/i18n.js"></script>
</body>
</html>
